[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ymb-skill-workspace"
version = "1.3.0"
description = "YMB 流水技能与共享标准化包工作区。"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
standardization = [
  "pandas>=2.2.3,<3",
  "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.2,<3",
  "pdfplumber>=0.11.5,<0.12",
  "msoffcrypto-tool>=5.4,<6",
]
test = [
  "mypy>=1.13,<2",
  "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = [
  "bank-statement-standardization/tests",
]
pythonpath = [
  "ymb-standardization-core/src",
  "bank-statement-standardization/scripts",
]

[tool.setuptools]
py-modules = []

[tool.mypy]
python_version = "3.11"
mypy_path = "ymb-standardization-core/src"
files = [
  "ymb-standardization-core/src/ymb_standardization_core/models/read_result.py",
  "ymb-standardization-core/src/ymb_standardization_core/readers/base.py",
  "ymb-standardization-core/src/ymb_standardization_core/readers/registry.py",
  "ymb-standardization-core/src/ymb_standardization_core/transforms/repeated_header.py",
]
strict = true
follow_imports = "skip"
