[project]
name = "ymb-skill-workspace"
version = "1.2.8"
description = "YMB 流水技能与共享标准化包工作区。"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
standardization = [
  "pandas>=2.2.3,<3",
  "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.2,<3",
  "pdfplumber>=0.11.5,<0.12",
]
test = [
  "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = [
  "bank-statement-standardization/tests",
]
pythonpath = [
  "packages/ymb_standardization_core",
  "bank-statement-standardization/scripts",
]
