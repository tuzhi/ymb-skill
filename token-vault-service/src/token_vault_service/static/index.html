<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>可逆 Token Vault 脱敏服务</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px;
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 22px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    section {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid #d6dee8;
      border-radius: 8px;
      background: #fff;
    }

    .actions,
    .file-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
    }

    input[type="file"],
    input[type="text"] {
      max-width: 100%;
    }

    input[type="text"] {
      width: min(680px, 100%);
      border: 1px solid #c9d3df;
      border-radius: 6px;
      padding: 10px 12px;
      font: 15px/1.4 Consolas, "Microsoft YaHei", monospace;
    }

    input[readonly] {
      background: #eef3f8;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    textarea {
      width: 100%;
      min-height: 230px;
      resize: vertical;
      border: 1px solid #c9d3df;
      border-radius: 6px;
      padding: 12px;
      font: 15px/1.6 Consolas, "Microsoft YaHei", monospace;
      background: #fff;
      color: #17202a;
    }

    textarea[readonly] {
      background: #eef3f8;
    }

    button {
      width: fit-content;
      min-width: 118px;
      border: 0;
      border-radius: 6px;
      padding: 10px 18px;
      background: #126a60;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button.warning {
      background: #8a4b16;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #summary,
    #file-summary,
    #text-summary,
    #error {
      min-height: 24px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #summary,
    #file-summary,
    #text-summary {
      color: #26415f;
    }

    #error {
      color: #b42318;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      body {
        padding: 20px 12px;
      }

      h1 {
        font-size: 27px;
      }

      .fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>可逆 Token Vault 脱敏服务</h1>

    <section aria-label="文件脱敏">
      <h2>标准化文件脱敏</h2>
      <div class="file-row">
        <input id="file" type="file" accept=".csv,.xlsx,.xls,.pdf" multiple>
        <button id="file-tokenize" type="button">生成脱敏包</button>
      </div>
      <div id="file-summary" role="status" aria-live="polite"></div>
    </section>

    <section aria-label="文本脱敏">
      <h2>文本脱敏</h2>
      <div class="file-row">
        <input id="text-file" type="file" accept=".txt,.text,.log,.csv" multiple>
        <button id="text-tokenize" type="button">生成脱敏包</button>
      </div>
      <div id="text-summary" role="status" aria-live="polite"></div>
    </section>

    <section aria-label="逆脱敏">
      <h2>逆脱敏</h2>
      <div class="fields">
        <label>
          Token 化分析结果
          <textarea id="detokenize-input" autocomplete="off" spellcheck="false"></textarea>
        </label>
        <label>
          逆脱敏结果
          <textarea id="output" readonly></textarea>
        </label>
      </div>
      <label>
        原始文件 sha256
        <input id="file-sha256" type="text" autocomplete="off" spellcheck="false">
      </label>
      <div class="actions">
        <button id="detokenize" class="warning" type="button">逆脱敏</button>
      </div>
      <div id="summary" role="status" aria-live="polite"></div>
      <div id="error" role="alert"></div>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById("file");
    const fileTokenizeButton = document.getElementById("file-tokenize");
    const fileSummary = document.getElementById("file-summary");
    const textFileInput = document.getElementById("text-file");
    const textTokenizeButton = document.getElementById("text-tokenize");
    const textSummary = document.getElementById("text-summary");
    const output = document.getElementById("output");
    const detokenizeInput = document.getElementById("detokenize-input");
    const fileSha256 = document.getElementById("file-sha256");
    const detokenizeButton = document.getElementById("detokenize");
    const summary = document.getElementById("summary");
    const error = document.getElementById("error");
    const buttons = [fileTokenizeButton, textTokenizeButton, detokenizeButton];

    function formatLabels(labels) {
      const entries = Object.entries(labels || {});
      if (entries.length === 0) {
        return "{}";
      }
      return entries.map(([label, count]) => `${label}: ${count}`).join(", ");
    }

    function setBusy(isBusy) {
      for (const item of buttons) {
        item.disabled = isBusy;
      }
    }

    function clearStatus() {
      output.value = "";
      summary.textContent = "";
      fileSummary.textContent = "";
      textSummary.textContent = "";
      error.textContent = "";
    }

    function showSummary(payload) {
      const info = payload.summary || {};
      summary.textContent = [
        `request_id: ${payload.request_id}`,
        `耗时: ${payload.latency_ms} ms`,
        `命中: ${info.span_count || info.replacement_count || 0}`,
        `标签: ${formatLabels(info.by_label)}`
      ].join(" | ");
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload && payload.error ? payload.error : "请求失败");
      }
      return payload;
    }

    fileTokenizeButton.addEventListener("click", async () => {
      setBusy(true);
      clearStatus();
      try {
        if (!fileInput.files || fileInput.files.length === 0) {
          throw new Error("请选择文件");
        }
        const form = new FormData();
        const selectedFiles = Array.from(fileInput.files);
        const isBatch = selectedFiles.length > 1;
        for (const selectedFile of selectedFiles) {
          form.append(isBatch ? "files" : "file", selectedFile);
        }
        const response = await fetch(isBatch ? "/api/files/tokenize/batch" : "/api/files/tokenize", {
          method: "POST",
          body: form
        });
        if (!response.ok) {
          const payload = await response.json();
          throw new Error(payload && payload.error ? payload.error : "文件处理失败");
        }
        const blob = await response.blob();
        const filename = isBatch
          ? "tokenized_batch_bundle.zip"
          : `${selectedFiles[0].name.replace(/\.[^.]+$/, "")}_tokenized_bundle.zip`;
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
        fileSummary.textContent = `已生成 ${filename}`;
      } catch (err) {
        error.textContent = err instanceof Error ? err.message : "请求失败";
      } finally {
        setBusy(false);
      }
    });

    textTokenizeButton.addEventListener("click", async () => {
      setBusy(true);
      clearStatus();
      try {
        if (!textFileInput.files || textFileInput.files.length === 0) {
          throw new Error("请选择文本文件");
        }
        const form = new FormData();
        const selectedFiles = Array.from(textFileInput.files);
        for (const selectedFile of selectedFiles) {
          form.append("files", selectedFile);
        }
        const response = await fetch("/api/text-files/tokenize", {
          method: "POST",
          body: form
        });
        if (!response.ok) {
          const payload = await response.json();
          throw new Error(payload && payload.error ? payload.error : "文本文件处理失败");
        }
        const blob = await response.blob();
        const filename = "tokenized_text_bundle.zip";
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
        textSummary.textContent = `已生成 ${filename}`;
      } catch (err) {
        error.textContent = err instanceof Error ? err.message : "请求失败";
      } finally {
        setBusy(false);
      }
    });

    detokenizeButton.addEventListener("click", async () => {
      setBusy(true);
      clearStatus();
      try {
        if (!detokenizeInput.value.trim()) {
          throw new Error("逆脱敏输入为空");
        }
        if (!fileSha256.value.trim()) {
          throw new Error("请输入原始文件 sha256");
        }
        const payload = await postJson("/api/detokenize", {
          text: detokenizeInput.value,
          file_sha256: fileSha256.value.trim()
        });
        output.value = payload.text || "";
        showSummary(payload);
      } catch (err) {
        error.textContent = err instanceof Error ? err.message : "请求失败";
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
