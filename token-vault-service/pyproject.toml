[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-vault-service"
version = "0.1.0"
description = "Local reversible token vault service for bank statement preprocessing."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ymb-standardization-core @ file:///D:/PYTHON_WORK/ymb-skill/packages/ymb_standardization_core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "eval-type-backport>=0.2",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1.5,<4",
  "pandas>=2.2.3,<3",
  "xlrd>=2.0.2,<3",
  "pdfplumber>=0.11.5,<0.12",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8.2",
  "tomli>=2.0",
]
person-ner = [
  "hanlp>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
token_vault_service = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "src",
  "../packages/ymb_standardization_core",
]


